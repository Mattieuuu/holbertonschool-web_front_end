<!DOCTYPE html>
<html lang="en" dir="ltr">

    <head>

        <meta charset="utf-8" />
        <title>Task 7</title>

    </head>

    <body>

        <script
            src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>
        <script type="application/javascript">
            function createSearchForm() {
                const textInput = $('<input>').attr('type', 'text');
                const submitButton = $('<input>').attr('type', 'submit').val('Submit');
                const resultsList = $('<ul>');

                submitButton.click(function(e) {
                    e.preventDefault();
                    const searchValue = textInput.val();
                    queryWikipedia(searchValue);
                });

                $('body').append(textInput, submitButton, resultsList);
            }

            function addNewArticle(id, title, snippet) {
                const li = $('<li>');
                const paragraph1 = $('<p>');
                const paragraph2 = $('<p>');

                const idSpan = $('<span>').text(id + ' - ');
                const titleBold = $('<b>').text(title);
                paragraph1.append(idSpan, titleBold);

                paragraph2.html(snippet);

                li.append(paragraph1, paragraph2);
                $('ul').append(li);
            }

            function queryWikipedia(search) {
                $.ajax({
                    url: 'https://en.wikipedia.org/w/api.php',
                    method: 'GET',
                    dataType: 'json',
                    data: {
                        action: 'query',
                        list: 'search',
                        srsearch: search,
                        format: 'json',
                        origin: '*'
                    },
                    success: function(response) {
                        $('ul').empty();
                        const results = response.query.search;
                        results.forEach(function(result) {
                            addNewArticle(result.pageid, result.title, result.snippet);
                        });
                    }
                });
            }

            $(document).ready(function() {
                createSearchForm();
            });
        </script>

    </body>

</html>
