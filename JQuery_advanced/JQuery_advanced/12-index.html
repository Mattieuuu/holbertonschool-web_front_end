<!DOCTYPE html>
<html lang="en" dir="ltr">

    <head>

        <meta charset="utf-8" />
        <title>Task 12</title>

    </head>

    <body>

        <script
            src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>
        <script type="application/javascript">
            function addPostRow(data) {
                const paragraph = $('<p>').attr('id', 'row-' + data.id);
                const deleteSpan = $('<span>').text('(delete) ').css('cursor', 'pointer');
                const postSpan = $('<span>').text('Post created with id ' + data.id + ', title: ' + data.title + ', author: ' + data.author);
                
                deleteSpan.click(function() {
                    deletePost(data.id);
                });

                paragraph.append(deleteSpan, postSpan);
                $('body').append(paragraph);
            }

            function listPosts() {
                $.get('http://localhost:3000/posts')
                    .done(function(data) {
                        data.forEach(function(post) {
                            addPostRow(post);
                        });
                    })
                    .fail(function() {
                        alert('Server Error');
                    });
            }

            function buildForm() {
                const form = $('<form>');
                
                const authorDiv = $('<div>');
                const authorLabel = $('<label>').attr('for', 'author').text('Author');
                const authorInput = $('<input>').attr({
                    type: 'text',
                    id: 'author'
                });
                authorDiv.append(authorLabel, authorInput);

                const titleDiv = $('<div>');
                const titleLabel = $('<label>').attr('for', 'title').text('Title');
                const titleTextarea = $('<textarea>').attr('id', 'title');
                titleDiv.append(titleLabel, titleTextarea);

                const submitInput = $('<input>').attr('type', 'submit');

                form.append(authorDiv, titleDiv, submitInput);
                
                form.submit(function(e) {
                    e.preventDefault();
                    sendForm();
                });

                $('body').append(form);
            }

            function sendForm() {
                $('form').after('<p>About to send the query to the API</p>');
                
                const data = {
                    title: $('#title').val(),
                    author: $('#author').val()
                };

                $.post('http://localhost:3000/posts', data)
                    .done(function(response) {
                        addPostRow(response);
                    })
                    .fail(function() {
                        alert('Error sending the POST query');
                    });
            }

            function deletePost(id) {
                $.ajax({
                    url: 'http://localhost:3000/posts/' + id,
                    method: 'DELETE'
                })
                .done(function() {
                    $('#row-' + id).remove();
                })
                .fail(function() {
                    alert('Post was not deleted');
                });
            }

            $(document).ready(function() {
                listPosts();
                buildForm();
            });
        </script>

    </body>

</html>
