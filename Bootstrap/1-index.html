<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Holberton - Web Stack - Bootstrap</title>

        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    </head>
    <body>
        <div class="container-fluid">
            <!-- First line -->
            <div class="row">
                <div class="col-lg-3 col-12 bg-primary text-white text-center p-2">Primary</div>
                <div class="col-lg-3 col-12 bg-success text-white text-center p-2">Success</div>
                <div class="col-lg-3 col-12 bg-danger text-white text-center p-2">Danger</div>
                <div class="col-lg-3 col-12 bg-warning text-white text-center p-2">Warning</div>
            </div>

            <br>

            <!-- Second line -->
            <div class="row">
                <div class="col-sm-3 col-12 bg-primary text-white text-center p-2">Primary</div>
                <div class="col-sm-3 col-12 bg-success text-white text-center p-2">Success</div>
                <div class="col-sm-3 col-12 bg-danger text-white text-center p-2">Danger</div>
                <div class="col-sm-3 col-12 bg-warning text-white text-center p-2">Warning</div>
            </div>

            <br>

            <!-- Third line -->
            <div class="row">
                <div class="col-lg-2 col-12 bg-primary text-white text-center p-2">Primary</div>
                <div class="col-lg-4 col-12 bg-success text-white text-center p-2">Success</div>
                <div class="col-lg-6 col-12 bg-danger text-white text-center p-2">Danger</div>
            </div>

            <br>

            <!-- Fourth line -->
            <div class="row">
                <div class="col-12 col-md-3 order-1 order-md-3 order-lg-2 order-xl-1 bg-primary text-white text-center p-2">Primary</div>
                <div class="col-12 col-md-3 order-4 order-md-1 order-lg-3 order-xl-2 bg-success text-white text-center p-2">Success</div>
                <div class="col-12 col-md-3 order-2 order-md-4 order-lg-1 order-xl-3 bg-danger text-white text-center p-2">Danger</div>
                <div class="col-12 col-md-3 order-3 order-md-2 order-lg-4 order-xl-4 bg-warning text-white text-center p-2">Warning</div>
            </div>

            <br>

            <!-- Fifth line -->
            <div class="row justify-content-md-between">
                <div class="col-12 col-md-2 bg-primary text-white text-center p-2">Primary</div>
                <div class="col-12 col-md-2 bg-success text-white text-center p-2">Success</div>
            </div>

            <br>

            <!-- Last line -->
            <div class="row justify-content-md-around">
                <div class="col-12 col-md-2 bg-primary text-white text-center p-2">Primary</div>
                <div class="col-12 col-md-2 bg-success text-white text-center p-2">Success</div>
                <div class="col-12 col-md-2 bg-danger text-white text-center p-2">Danger</div>
            </div>
        </div>
    </body>
</html>
